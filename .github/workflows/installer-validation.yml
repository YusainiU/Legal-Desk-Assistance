name: Installer validation
on:
  push:
    paths:
      - 'install.sh'
      - 'update.sh'
      - 'installer/**'
      - 'tests/installer/**'
      - '.github/workflows/installer-validation.yml'
  pull_request:
    paths:
      - 'install.sh'
      - 'update.sh'
      - 'installer/**'
      - 'tests/installer/**'
      - '.github/workflows/installer-validation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install validation tools
        run: sudo apt-get update && sudo apt-get install -y shellcheck php-cli
      - name: Bash syntax and smoke checks
        run: bash tests/installer/smoke.sh
      - name: ShellCheck
        run: shellcheck -S warning -s bash -x install.sh update.sh installer/*.sh tests/installer/smoke.sh
